[project]
name = "invest-assistant-backend"
version = "0.1.0"
description = "日本股票投资助手 — backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "structlog>=24.4",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "pandas>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Keep tmp_path inside the project: the default %TEMP%\pytest-of-<user> tree
# is unreadable for this account (WinError 5), which fails any test using the
# tmp_path fixture before it runs.
addopts = "--basetemp=.pytest-tmp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
